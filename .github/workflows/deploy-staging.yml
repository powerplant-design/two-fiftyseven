name: Deploy to Kinsta Staging

on:
  push:
    branches:
      - deploy/staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build theme assets
        run: npm run build

      - name: Deploy to Kinsta staging via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KINSTA_STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.KINSTA_STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.KINSTA_STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.KINSTA_STAGING_SSH_PORT }}
          THEME_PATH: ${{ secrets.KINSTA_STAGING_THEME_PATH }}
        run: |
          # Write the private key to a temp file
          echo "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          rsync -avz --delete \
            -e "ssh -i /tmp/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='.env' \
            ./ \
            "$SSH_USER@$SSH_HOST:$THEME_PATH/"

          rm /tmp/deploy_key
